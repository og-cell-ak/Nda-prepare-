name: Build NDA Prepare APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html','styles.css','app.js','bank.js','package.json','capacitor.config.json','scripts/**','.github/workflows/build-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: actions/setup-node@v4
        name: Set up Node
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        name: Set up Java
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Run content and syntax checks
        run: npm run check
      - name: Build web assets
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync Android assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        name: Upload APK artifact
        with:
          name: NDA-Prepare-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14